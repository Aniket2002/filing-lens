[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "filing-lens"
version = "0.1.0"
description = "An auditable filings retrieval benchmark with table-grounded numeric controls"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "AGPL-3.0-or-later"
dependencies = [
  "numpy>=2.1,<3",
  "pymupdf>=1.26,<1.28",
  "rank-bm25==0.2.2",
  "sentence-transformers>=5.1,<6",
  "httpx>=0.28,<0.29",
  "rich>=14,<15",
  "matplotlib>=3.10,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "ruff>=0.13,<1"]

[project.scripts]
filing-lens = "filing_lens.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/filing_lens"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
