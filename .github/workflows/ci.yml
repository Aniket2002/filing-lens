name: Verify benchmark and controls
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run python scripts/audit_reference.py
      - run: uv run python scripts/audit_generation_results.py
      - run: uv run python scripts/audit_explanation_results.py
      - run: uv run python scripts/audit_retrieval_results.py
      - run: uv run python scripts/build_paper.py --check
      - run: uv run python scripts/run_equivariance.py audit
      - run: uv run python scripts/run_document_interventions.py audit
      - run: uv run python scripts/run_context_controls.py --check
      - run: uv run python scripts/report_equivariance.py --check

  retrieval-replay:
    needs: tests
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev --python 3.12
      - uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/processed/pages.jsonl
          key: replay-v1-${{ runner.os }}-${{ hashFiles('data/source-lock.json', 'data/replay-source-mirrors.json', 'data/benchmark-lock.json', 'data/corpus.json', 'src/filing_lens/corpus.py', 'src/filing_lens/table_layout.py', 'src/filing_lens/io.py', 'scripts/prepare_replay_corpus.py', 'uv.lock') }}
      - name: Restore and verify the locked parsed corpus
        run: uv run python scripts/prepare_replay_corpus.py
      - name: Rebuild all 16 indexes and replay all 800 outcomes
        run: uv run python scripts/run_document_interventions.py audit --replay
